name: Deploy to Production (CD)

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # --- PASO A: DESPLIEGUE DEL CÓDIGO PHP CON SCP (OPTIMIZADO PARA CONTRASEÑA) ---
      - name: Subir archivos al VPS vía SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: '.'
          target: '/var/www/HomeOrganization'
          # Evitamos subir archivos locales de configuración o de Git innecesarios
          rm: false
          strip_components: 0

      - name: Reiniciar PHP-FPM para limpiar caché de código
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            sudo systemctl restart php8.2-fpm
