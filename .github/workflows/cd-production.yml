name: Deploy to Production (CD)

# Se dispara únicamente cuando se hace un merge o push confirmado a main
on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # --- PASO A: DESPLIEGUE DEL CÓDIGO PHP ---
      - name: Subir archivos al VPS vía SSH/Rsync
        uses: Burnett01/rsync-deployments@5.2.1
        with:
          switches: -avzr --delete
          path: .
          remote_path: /var/www/HomeOrganization
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: '' # Dejar vacío si usas contraseña
          ssh_cmd_args: '-o StrictHostKeyChecking=no'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}

      - name: Reiniciar PHP-FPM para limpiar caché de código
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            sudo systemctl restart php8.2-fpm
